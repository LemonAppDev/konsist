name: Check Test Project

on:
  push:
    branches: [ main, develop ]

  pull_request:
    types: [ opened, synchronize ]

# Runs on develop are not cancelled, so each merge is tested against its own snapshot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ======================================= Published Snapshot =======================================

  # Test projects are tested against Konsist snapshot published by the Publish workflow
  published-snapshot:
    name: Get Published Snapshot
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.published-snapshot.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Published Konsist Snapshot
        id: published-snapshot
        uses: ./.github/actions/get-published-konsist-snapshot
        with:
          github-token: ${{ github.token }}

  # ======================================= Check Declarations =======================================

  declaration-tester-project-ubuntu:
    name: Declaration Tester Project Ubuntu
    needs: published-snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: |
            11
            25
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'

      - name: Use Konsist Snapshot From Maven Central
        run: python misc/scripts/replace_konsist_version/use_konsist_snapshot_in_test_project.py misc/projects/test-projects/konsist-declaration-tester ${{ needs.published-snapshot.outputs.version }}

      - name: Run Integration Test
        run: cd misc/projects/test-projects/konsist-declaration-tester/ && ./gradlew integrationTest

      - name: Upload Report
        if: always() # Ensure the step runs regardless of the outcome of previous steps (failed tests will be uploaded)
        uses: actions/upload-artifact@v7
        with:
          name: declaration-tester-project-ubuntu-test-report
          path: misc/projects/test-projects/konsist-declaration-tester/app/build/reports/integrationTest

  declaration-tester-project-macos:
    name: Declaration Tester Project MacOS
    needs: published-snapshot
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

