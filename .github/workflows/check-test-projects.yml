name: Check Test Project

on:
  push:
    branches: [ main, develop ]

  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================================= Check Declarations =======================================

  declaration-tester-project-ubuntu:
    name: Declaration Tester Project Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: |
            11
            25
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Konsist Artifact To Local Maven Repository
        run: >
          ./gradlew publishToMavenLocal
          -P konsist.releaseTarget=local

      - name: Run Integration Test
        run: cd misc/projects/test-projects/konsist-declaration-tester/ && ./gradlew integrationTest

      - name: Upload Report
        if: always() # Ensure the step runs regardless of the outcome of previous steps (failed tests will be uploaded)
        uses: actions/upload-artifact@v7
        with:
          name: declaration-tester-project-ubuntu-test-report
          path: misc/projects/test-projects/konsist-declaration-tester/app/build/reports/integrationTest

  declaration-tester-project-macos:
    name: Declaration Tester Project MacOS
    runs-on: macos-latest
