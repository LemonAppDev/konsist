        uses: gradle/actions/setup-gradle@v6

      - name: Publish Konsist Artifact To Local Maven Repository
        run: >
          ./gradlew publishToMavenLocal
          -P konsist.releaseTarget=local

      - name: Get Konsist Snapshot Version
        shell: bash
        run: echo "KONSIST_VERSION=$(grep '^konsist.version=' gradle.properties | cut -d= -f2 | tr -d '\r')-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Run Root Test
        run: cd misc/projects/test-projects/konsist-root-path-maven-tester/ && ./mvnw -B test -N "-Dkonsist.version=${{ env.KONSIST_VERSION }}"

      - name: Run App Test
        run: cd misc/projects/test-projects/konsist-root-path-maven-tester/ && ./mvnw -B test -pl app "-Dkonsist.version=${{ env.KONSIST_VERSION }}"

