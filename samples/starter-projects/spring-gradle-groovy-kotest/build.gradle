plugins {
    alias(libs.plugins.springBoot)
    alias(libs.plugins.dependencyManagement)
    alias(libs.plugins.kotlinJvm)
    alias(libs.plugins.kotlinSpring)
    alias(libs.plugins.jvmTestSuite)
}

group = 'com.sample'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // The 'api' is used, so classes are available in the konsistTest source set
    api(libs.spring.boot.starter)

    implementation(libs.kotlin.reflect)

    testImplementation(libs.spring.boot.starter.test)
}

kotlin {
    jvmToolchain(21)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
    useJUnitPlatform()
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }

        konsistTest(JvmTestSuite) {
            dependencies {
                // Add 'main' source set dependency
                implementation project()

                // Add Konsist dependency
                implementation(libs.konsist)

                // Add Kotest dependency
                implementation(libs.kotest)
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                    }
                }
            }
        }
    }
}

// Optional block to run Konsist tests together with the Gradle 'check' task
tasks.named('check') {
    dependsOn(testing.suites.konsistTest)
}
