[versions]
kotlinVersion = "2.4.21"

[libraries]
kotlinCompiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlinVersion" }
junitJupiterEngine = "org.junit.jupiter:junit-jupiter-engine:5.14.4"
junitPlatformLauncher = "org.junit.platform:junit-platform-launcher:6.1.3"
kluent = "org.amshove.kluent:kluent:1.73"
# Newest version will be retrieved from mavenLocal
konsist = "com.lemonappdev:konsist:+"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
testLogger = "com.adarshr.test-logger:4.0.0"
